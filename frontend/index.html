    <script>
      // Suppress browser/DevTools injected web-vitals / soft-navigation race condition error
      // (Cannot read properties of undefined reading 'startTime' at reportAllChanges)
      (function () {
        function shouldSuppress(msg, err) {
          var str = ((msg || '') + ' ' + (err && err.message || '') + ' ' + (err && err.stack || '')).toLowerCase();
          return str.indexOf('starttime') !== -1 && (str.indexOf('reportallchanges') !== -1 || str.indexOf('reading \'starttime\'') !== -1);
        }
        window.addEventListener('error', function (e) {
          if (shouldSuppress(e.message, e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          var msg = (reason && reason.message) || String(reason || '');
          if (shouldSuppress(msg, reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
        var origOnError = window.onerror;
        window.onerror = function (msg, src, line, col, err) {
          if (shouldSuppress(msg, err)) return true;
          if (origOnError) return origOnError.apply(this, arguments);
        };
      })();
    </script>
